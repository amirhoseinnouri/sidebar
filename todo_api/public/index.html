<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست کارهای من</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-clipboard-list"></i> لیست کارهای روزانه</h1>

        <form id="todo-form">
            <input type="text" id="todo-title" placeholder="عنوان کار جدید..." required>
            <input type="text" id="todo-description" placeholder="توضیحات (اختیاری)...">
            <button type="submit"><i class="fas fa-plus-circle"></i> اضافه کردن کار</button>
        </form>

        <ul id="todo-list">
            </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
